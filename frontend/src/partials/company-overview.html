                    <!-- Company Overview -->
                    <section id="company-overview" class="company-header">
                        <div class="company-top">
                            <div class="company-identity">
                                <h2 id="company-name"></h2>
                                <p id="company-ticker" class="company-ticker"></p>
                            </div>

                            <div class="watchlist-controls">
                                <button type="button" id="save_watchlist">
                                    <i data-lucide="bookmark-plus"></i>
                                    Add to watchlist
                                </button>

                                
                                <div id="watchlist-actions">
                                    <div class="watchlist-status-controls">
                                        <button type="button" id="in_watchlist" disabled>
                                            <i data-lucide="bookmark-check"></i>
                                            In watchlist
                                        </button>
                                    </div>

                                    <div class="save-analysis-control">
                                        <button type="button" id="update_analysis">
                                            <i data-lucide="save"></i>
                                            Save analysis
                                        </button>
                                        <span id="analysis-last-saved" aria-live="polite">
                                            Last saved: Not saved yet
                                        </span>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <div class="company-summary">
                            <div class="summary-item">
                                <span class="metric-label">Price</span>
                                <span class="metric-value" id="share-price"></span>
                            </div>
                            <div class="summary-item">
                                <span class="metric-label">Market Capitalization</span>
                                <span class="metric-value" id="market-cap"></span>
                            </div>
                            <div class="summary-item">
                                <span class="metric-label">CEO</span>
                                <span class="metric-value" id="company-ceo"></span>
                            </div>
                        </div>
                    </section>
