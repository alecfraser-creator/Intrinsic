                    <!-- Qualitative Analysis -->
                    <div
                        id="qualitative-panel"
                        class="is-hidden"
                        role="tabpanel"
                        aria-labelledby="qualitative-tab"
                    >
                        <div class="qualitative-header">
                            <div>
                                <h2>Qualitative Analysis</h2>
                                <p class="qualitative-description">
                                    Document the business, evaluate its quality, and develop your investment thesis.
                                </p>
                            </div>
                        </div>

                        <div class="qualitative-sections">

                            <details class="qualitative-section">
                                <summary>01. Business Overview</summary>
                                <div class="qualitative-fields">
                                    <label for="business-model">Business model and main products or services</label>
                                    <textarea id="business-model" rows="4"></textarea>

                                    <label for="revenue-streams">Revenue streams and customer segments</label>
                                    <textarea id="revenue-streams" rows="4"></textarea>

                                    <label for="geographic-exposure">Geographic exposure and key dependencies</label>
                                    <textarea id="geographic-exposure" rows="4"></textarea>
                                </div>
                            </details>

                            <details class="qualitative-section">
                                <summary>02. Competitive Advantage</summary>
                                <div class="qualitative-fields">
                                    <label for="competitive-advantages">Sources of competitive advantage</label>
                                    <textarea id="competitive-advantages" rows="4"></textarea>

                                    <label for="moat-durability">Moat durability and supporting evidence</label>
                                    <textarea id="moat-durability" rows="4"></textarea>

                                    <label for="competitors-threats">Competitors and threats to the moat</label>
                                    <textarea id="competitors-threats" rows="4"></textarea>
                                </div>
                            </details>

                            <details class="qualitative-section">
                                <summary>03. Management &amp; Capital Allocation</summary>
                                <div class="qualitative-fields">
                                    <label for="management-track-record">Management track record and leadership quality</label>
                                    <textarea id="management-track-record" rows="4"></textarea>

                                    <label for="insider-alignment">Insider ownership, incentives and shareholder alignment</label>
                                    <textarea id="insider-alignment" rows="4"></textarea>

                                    <label for="capital-allocation">Capital allocation decisions and their results</label>
                                    <textarea id="capital-allocation" rows="4"></textarea>
                                </div>
                            </details>

                            <details class="qualitative-section">
                                <summary>04. Financial Quality</summary>
                                <div class="qualitative-fields">
                                    <label for="earnings-quality">Earnings quality and cash-flow reliability</label>
                                    <textarea id="earnings-quality" rows="4"></textarea>

                                    <label for="cyclicality-resilience">Cyclicality and resilience during downturns</label>
                                    <textarea id="cyclicality-resilience" rows="4"></textarea>

                                    <label for="accounting-concerns">Capital intensity, reinvestment needs and accounting concerns</label>
                                    <textarea id="accounting-concerns" rows="4"></textarea>
                                </div>
                            </details>

                            <details class="qualitative-section">
                                <summary>05. Growth Prospects</summary>
                                <div class="qualitative-fields">
                                    <label for="growth-drivers">Main growth drivers</label>
                                    <textarea id="growth-drivers" rows="4"></textarea>

                                    <label for="market-opportunity">Market opportunity and remaining runway</label>
                                    <textarea id="market-opportunity" rows="4"></textarea>

                                    <label for="reinvestment-opportunities">Reinvestment opportunities and expected returns</label>
                                    <textarea id="reinvestment-opportunities" rows="4"></textarea>
                                </div>
                            </details>

                            <details class="qualitative-section">
                                <summary>06. Risks &amp; Red Flags</summary>
                                <div class="qualitative-fields">
                                    <label for="business-risks">Key business and industry risks</label>
                                    <textarea id="business-risks" rows="4"></textarea>

                                    <label for="external-threats">Regulatory, technological and competitive threats</label>
                                    <textarea id="external-threats" rows="4"></textarea>

                                    <label for="red-flags">Red flags and potential permanent capital impairment</label>
                                    <textarea id="red-flags" rows="4"></textarea>
                                </div>
                            </details>

                            <details class="qualitative-section">
                                <summary>07. Investment Thesis</summary>
                                <div class="qualitative-fields">
                                    <label for="investment-case">Why is this an attractive business?</label>
                                    <textarea id="investment-case" rows="4"></textarea>

                                    <label for="market-misunderstanding">What might the market be misunderstanding?</label>
                                    <textarea id="market-misunderstanding" rows="4"></textarea>

                                    <label for="attractive-price">Under what conditions would the stock be attractive at its current price?</label>
                                    <textarea id="attractive-price" rows="4"></textarea>

                                    <label for="thesis-invalidation">What would invalidate the investment thesis?</label>
                                    <textarea id="thesis-invalidation" rows="4"></textarea>
                                </div>
                            </details>

                        </div>
                    </div>
