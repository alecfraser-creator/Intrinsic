                        <!-- Financial Strength -->
                        <section id="financial-strength" class="dashboard-section">
                            <h2 class="section-heading">Financial Strength</h2>

                            <div class="metrics-grid">
                                <div class="metric-card">
                                    <span class="metric-label">
                                        Cash
                                        <button type="button" class="metric-info" data-metric="cash" aria-label="Explain cash">i</button>
                                    </span>
                                    <span class="metric-value" id="cash"></span>
                                </div>

                                <div class="metric-card">
                                    <span class="metric-label">
                                        Total debt
                                        <button type="button" class="metric-info" data-metric="total-debt" aria-label="Explain total debt">i</button>
                                    </span>
                                    <span class="metric-value" id="total-debt"></span>
                                </div>

                                <div class="metric-card">
                                    <span class="metric-label">
                                        Net debt
                                        <button type="button" class="metric-info" data-metric="net-debt" aria-label="Explain net debt">i</button>
                                    </span>
                                    <span class="metric-value" id="net-debt"></span>
                                </div>

                                <div class="metric-card">
                                    <span class="metric-label">
                                        Debt / equity
                                        <button type="button" class="metric-info" data-metric="debt-equity" aria-label="Explain debt to equity">i</button>
                                    </span>
                                    <span class="metric-value" id="debt-equity"></span>
                                </div>

                                <div class="metric-card">
                                    <span class="metric-label">
                                        Current ratio
                                        <button type="button" class="metric-info" data-metric="current-ratio" aria-label="Explain current ratio">i</button>
                                    </span>
                                    <span class="metric-value" id="current-ratio"></span>
                                </div>

                                <div class="metric-card">
                                    <span class="metric-label">
                                        Interest coverage
                                        <button type="button" class="metric-info" data-metric="interest-coverage" aria-label="Explain interest coverage">i</button>
                                    </span>
                                    <span class="metric-value" id="interest-coverage"></span>
                                </div>
                            </div>
                        </section>
