
                    <!-- Authentication Modal -->
                    <div id="auth-modal" class="modal is-hidden">
                        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="auth-title">

                            <h2 id="auth-title">Log in to Intrinsic</h2>

                            <p id="auth-description">
                                Create an account or log in to save your analyses and manage your watchlist.
                            </p>

                            <form id="auth-form">

                                <label for="auth-email">Email</label>
                                <input
                                    type="email"
                                    id="auth-email"
                                    autocomplete="email"
                                    placeholder="you@example.com"
                                    required
                                >

                                <label for="auth-password">Password</label>
                                <input
                                    type="password"
                                    id="auth-password"
                                    autocomplete="current-password"
                                    placeholder="Your password"
                                    required
                                    minlength="6"
                                >

                                <p id="auth-error" class="is-hidden" role="alert"></p>

                                <button type="submit" id="auth-submit">
                                    Log in
                                </button>

                            </form>

                            <button type="button" id="auth-toggle">
                                Don't have an account? Sign up
                            </button>

                            <button type="button" id="auth-close">
                                Cancel
                            </button>

                        </div>
                    </div>
